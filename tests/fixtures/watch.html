<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px Roboto,Arial} #columns{display:flex} #primary{flex:1} #secondary{width:400px} #movie_player{aspect-ratio:16/9;background:#000;position:relative}</style></head>
<body><ytd-app>
<ytd-watch-flexy is-two-columns_>
 <div id="columns">
  <div id="primary"><div id="primary-inner">
   <div id="player"><div id="player-container-outer"><div id="player-container-inner"><div id="player-container"><ytd-player id="ytd-player"><div id="movie_player"><video class="html5-main-video" muted></video></div></ytd-player></div></div></div></div>
   <div id="below">
    <ytd-watch-metadata>
     <div id="title"><h1><yt-formatted-string>Fixture video title</yt-formatted-string></h1></div>
     <div id="top-row"><div id="owner"><div id="upload-info">Fixture Channel</div><div id="subscribe-button">Subscribe</div></div>
     <div id="actions"><div id="actions-inner"><div id="top-level-buttons-computed"><button>Like</button></div></div></div></div>
     <div id="bottom-row"><div id="description" class="ytd-watch-metadata">Fixture description</div></div>
    </ytd-watch-metadata>
    <ytd-merch-shelf-renderer>merch</ytd-merch-shelf-renderer>
    <ytd-comments id="comments"><div>comment 1</div></ytd-comments>
   </div>
  </div></div>
  <div id="secondary"><div id="secondary-inner">
   <div id="chat-container"></div>
   <div id="related"><div id="items"><div>rec 1</div><div>rec 2</div></div></div>
  </div></div>
 </div>
</ytd-watch-flexy>
</ytd-app>
<script>
// YouTube's player API, as the content script uses it
const mp=document.getElementById('movie_player');
mp.getVideoData=()=>({video_id:'abcdefghijk',title:'Fixture video title',author:'Fixture Channel'});
mp.getPlayerResponse=()=>({videoDetails:{viewCount:'1000',author:'Fixture Channel'}});
// like YouTube: every page load ends with yt-navigate-finish
addEventListener('load', () => document.dispatchEvent(new CustomEvent('yt-navigate-finish', { bubbles: true })));
</script></body></html>
