<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 270px; margin: 0; padding: 12px; background: #0f0f0f; color: #f1f1f1; font: 13px Roboto, system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 15px; }
  h2 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #aaa; }
  label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  label.stack { flex-direction: column; align-items: stretch; gap: 4px; }
  input[type=number] { width: 56px; margin-left: auto; background: #222; color: inherit; border: 1px solid #444; border-radius: 4px; }
  textarea { background: #222; color: inherit; border: 1px solid #444; border-radius: 4px; font: inherit; resize: vertical; }
  #full { width: 100%; margin-top: 12px; height: 34px; border: 0; border-radius: 17px; background: #f1f1f1; color: #0f0f0f; font: 500 13px Roboto, sans-serif; cursor: pointer; }
  .hint { color: #888; font-size: 11px; margin: 10px 0 0; }
</style>
</head>
<body>
<h1>EliteYT</h1>
<div id="form"></div>
<button type="button" id="full">Open layout studio</button>
<p class="hint">Speed keys: <b>]</b> faster, <b>[</b> slower, <b>\</b> reset.</p>
<script src="src/defaults.js"></script>
<script src="src/settings-form.js"></script>
<script src="popup.js"></script>
</body>
</html>
